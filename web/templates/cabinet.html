<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>{{ .title }}</title>

    <link
        rel="stylesheet"
        href="/static/styles.css?v=1"
    >
</head>

<body>
    <main class="page">
        <section class="card card--wide">
            <div class="cabinet-header">
                <div>
                    <div class="logo">
                        <span class="logo__mark">T</span>
                        TOKENCHECKER
                    </div>

                    <h1>Личный кабинет</h1>

                    <p>
                        Пространство только для тебя.
                    </p>
                </div>

                <button
                    id="logoutBtn"
                    class="button button--secondary"
                    type="button"
                >
                    Выйти
                </button>
            </div>

            <section class="message-box">
                <h2>
                    Сообщение следующей версии меня
                </h2>

                <p class="subtitle">
                    Напиши то, что хочешь сохранить
                    для себя в будущем.
                </p>

                <form id="messageForm">
                    <div class="field">
                        <textarea
                            id="messageText"
                            name="message"
                            maxlength="5000"
                            placeholder="Напиши что-нибудь важное..."
                            required
                        ></textarea>
                    </div>

                    <div class="message-actions">
                        <p
                            id="messageResult"
                            class="result"
                        ></p>

                        <button
                            class="button button--primary"
                            type="submit"
                        >
                            Сохранить сообщение
                        </button>
                    </div>
                </form>
            </section>
        </section>
    </main>

    <script src="/static/app.js?v=7"></script>
</body>
</html>
