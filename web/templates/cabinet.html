<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ .title }}</title>
</head>
<body>
    <h1>Личный кабинет</h1>

    <h2>Сообщение следующей версии меня</h2>

    <form id="messageForm">
        <div>
            <textarea
                id="messageText"
                name="message"
                rows="10"
                cols="60"
                maxlength="5000"
                placeholder="Напиши сообщение следующей версии себя..."
                required
            ></textarea>
        </div>

        <button type="submit">
            Сохранить
        </button>
    </form>

    <p id="messageResult"></p>

    <button id="logoutBtn" type="button">
        Выйти
    </button>

    <script src="/static/app.js?v=5"></script>
</body>
</html>
