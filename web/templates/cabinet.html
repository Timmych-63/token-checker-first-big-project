<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ .title }}</title>
</head>
<body>
    <h1>Кабинет</h1>

    <p>Здесь пользователь сможет сохранить сообщение для следующей версии себя.</p>

    <form id="messageForm">
        <div>
            <label for="messageText">Сообщение следующей версии меня</label>
            <br>
            <textarea id="messageText" name="message" rows="5" cols="40"></textarea>
        </div>

        <button type="submit">Сохранить</button>
    </form>

    <p id="messageResult"></p>

    <button id="logoutBtn">Выйти</button>

    <script src="/static/app.js"></script>
</body>
</html>
