<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>{{ .title }}</title>

    <link
        rel="stylesheet"
        href="/static/styles.css?v=1"
    >
</head>

<body>
    <main class="page">
        <section class="card hero">
            <div class="logo">
                <span class="logo__mark">T</span>
                TOKENCHECKER
            </div>

            <div class="hero__badge">
                Сообщение будущему себе
            </div>

            <h1>
                Оставь сообщение следующей версии себя
            </h1>

            <p class="subtitle">
                Создай аккаунт, сохрани важную мысль
                и вернись к ней позже.
            </p>

            <div class="hero__actions">
                <button
                    id="goToRegisterBtn"
                    class="button button--primary button--full"
                    type="button"
                >
                    Создать аккаунт
                </button>

                <a
                    class="button button--secondary button--full"
                    href="/login"
                >
                    Войти
                </a>
            </div>
        </section>
    </main>

    <script src="/static/app.js?v=7"></script>
</body>
</html>
